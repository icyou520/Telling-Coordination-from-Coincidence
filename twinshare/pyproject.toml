[project]
name = "twinshare"
version = "0.1.0"
description = "Interaction share: is a group coordinated beyond its members' own histories and the recorded causes?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eric J. Couture" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
twinshare = "twinshare.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinshare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
